name: {{app_name.snakeCase()}}
description: "{{app_name.titleCase()}}"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ^3.38.5

dependencies:
  # ============================================================
  # 🎯 Core & UI Framework
  # ============================================================
  flutter:
    sdk: flutter

  # ============================================================
  # 🏗️ Architecture & State Management
  # ============================================================
  flutter_bloc: ^9.1.1 # BLoC pattern for state management
  get_it: ^9.2.0 # Service Locator for DI
  injectable: ^2.7.1+4 # Code generator for GetIt
  equatable: ^2.0.8 # Value equality comparisons (helps Bloc)
  bloc: ^9.2.0
  bloc_concurrency: ^0.3.0 # droppable/restartable/sequential event transformers
  fpdart: ^1.2.0 # Functional programming (Either, Option)

  # ============================================================
  # 🧭 Navigation & Routing
  # ============================================================
  auto_route: ^11.1.0 # Robust navigation package with code gen

  # ============================================================
  # 🌐 Networking & Connectivity
  # ============================================================
  dio: ^5.9.0 # Powerful HTTP client

  # ============================================================
  # 💾 Data, Storage & Serialization
  # ============================================================
  flutter_secure_storage: ^10.0.0 # Secure storage for keys/tokens
  json_annotation: ^4.9.0 # Annotations for JSON serialization

  # ============================================================
  # 📱 Device Features & Permissions
  # ============================================================
{{#use_permissions}}
  permission_handler: ^12.0.1 # Handle OS permissions
  geolocator: ^14.0.2 # Access GPS/Location services
{{/use_permissions}}

  # ============================================================
  # 🔔 Notifications & Firebase
  # ============================================================
{{#use_firebase}}
  firebase_core: ^4.4.0 # Core Firebase setup
{{/use_firebase}}
{{#use_notifications}}
  firebase_messaging: ^16.1.1 # FCM (Push Notifications)
  awesome_notifications: ^0.10.1 # Local notifications & custom sounds
{{/use_notifications}}

  # ============================================================
  # 🌍 Localization & Formatting
  # ============================================================
  easy_localization: ^3.0.8 # Internationalization (i18n) wrapper

  # ============================================================
  # 🛠️ Utilities & Helpers
  # ============================================================
  logger: ^2.6.2 # Pretty console logging
  rxdart: ^0.28.0 # Reactive extensions (Streams)
  freezed_annotation: ^3.1.0
  shared_preferences: ^2.5.4

dev_dependencies:
  # ============================================================
  # 🧪 Testing
  # ============================================================
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4 # Codegen-free mocks (preferred for new tests)
  shared_preferences_platform_interface: ^2.4.1 # In-memory prefs for DI/storage tests
  bloc_test: ^10.0.0 # Testing helpers for BLoC

  # ============================================================
  # 🏗️ Code Generation (Build Runner)
  # ============================================================
  build_runner: ^2.7.1 # Orchestrates code generation
  injectable_generator: ^2.8.1 # Generates DI code for Injectable
  json_serializable: ^6.11.1 # Generates JSON serialization logic
  freezed: ^3.2.3 # Generates unions/data classes
  auto_route_generator: ^10.2.4 # Generates routing code
  flutter_gen_runner: ^5.12.0 # Generates typed asset references (Assets.images.logo)

  # ============================================================
  # 🧹 Linting & Quality Control
  # ============================================================
  flutter_lints: ^6.0.0 # Official Flutter lint rules
  custom_lint_builder: ^0.8.1 # Framework for creating custom lint rules
  app_custom_lints: # Custom lint rules from Git
    git:
      url: https://github.com/AlexxyQQ/custom_lints.git
      ref: 21861a7f0fd56aaa33eb01e31c1d8d241eca814a # pinned commit (never track a moving branch)

  # ============================================================
  # 🎨 Asset tooling (configured by the `splash_master` / `icons_launcher` blocks below)
  # ============================================================
  icons_launcher: ^3.1.0 # `rps icons` — launcher icons
  splash_master: ^1.0.0+1 # `rps icons` — native splash screens

# ============================================================
# 🎨 FlutterGen (Assets) Configuration
# ============================================================
flutter_gen:
  output: lib/config/constants/gen

flutter:
  uses-material-design: true

  # Asset directories
  # NOTE: `env/` is intentionally NOT an asset. Configuration is compiled in with
  # `--dart-define-from-file=env/<flavor>.json` (see docs/FLAVORS.md).
  assets:
    - assets/images/
    - assets/translations/

#============================================================
# 📜 Custom Scripts (via `rps`)
#  dart pub global activate rps
#  EG: rps gen · rps run dev · rps build apk prod
#
#  Flavored commands read compile-time config from env/<flavor>.json
#  (copy env/<flavor>.example.json first — see docs/FLAVORS.md).
#  Release builds are obfuscated; keep build/symbols/ to symbolicate crashes.
#============================================================
scripts:
  #============================================================
  # 🧹 Maintenance & Code Quality
  #============================================================
  get: flutter pub get
  reset: flutter clean && flutter pub get && rps gen
  fix: dart fix --apply
  format: dart format lib test
  analyze: flutter analyze && dart run custom_lint
  test: flutter test --coverage
  # Everything CI checks, in the same order (run before pushing).
  check: rps gen && dart format --output=none --set-exit-if-changed lib test && flutter analyze && flutter test

  #============================================================
  # 🧬 Code Generation (generated files are git-ignored)
  #============================================================
  # build_runner (Freezed, JSON, injectable, auto_route, flutter_gen) + locale keys
  gen: dart run build_runner build --delete-conflicting-outputs && rps gen:keys
  # Create the git-ignored Firebase config from the tracked *.example files (never overwrites)
  firebase:init: bash scripts/firebase_init.sh
  gen:keys: dart run easy_localization:generate -S assets/translations -f keys -O lib/config/constants/gen -o locale_keys.g.dart
  watch: rps gen:keys && dart run build_runner watch --delete-conflicting-outputs
  icons: dart run splash_master create && dart run icons_launcher:create

  #============================================================
  # ▶️ Run (per flavor)
  #============================================================
  run:
    dev: flutter run --dart-define-from-file=env/dev.json
    staging: flutter run --dart-define-from-file=env/staging.json
    prod: flutter run --release --dart-define-from-file=env/prod.json

  #============================================================
  # 📦 Release builds (per flavor, obfuscated, symbols in build/symbols)
  #============================================================
  build:
    apk:
      dev: flutter build apk --release --obfuscate --split-debug-info=build/symbols/dev --dart-define-from-file=env/dev.json
      staging: flutter build apk --release --obfuscate --split-debug-info=build/symbols/staging --dart-define-from-file=env/staging.json
      prod: flutter build apk --release --obfuscate --split-debug-info=build/symbols/prod --dart-define-from-file=env/prod.json
    appbundle:
      staging: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols/staging --dart-define-from-file=env/staging.json
      prod: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols/prod --dart-define-from-file=env/prod.json
    ipa:
      staging: flutter build ipa --release --obfuscate --split-debug-info=build/symbols/staging --dart-define-from-file=env/staging.json
      prod: flutter build ipa --release --obfuscate --split-debug-info=build/symbols/prod --dart-define-from-file=env/prod.json

  #============================================================
  # 🎭 Maestro E2E (local only; see docs/MAESTRO.md)
  #============================================================
  maestro: bash scripts/maestro.sh
  maestro:fast: bash scripts/maestro.sh --no-build
  maestro:studio: maestro studio

  #============================================================
  # 🐦 Shorebird (optional OTA) — `--flutter-version` MUST match .fvmrc
  #============================================================
  shorebird:
    release:
      android: shorebird release android --flutter-version=3.44.1 --artifact=aab -- --obfuscate --split-debug-info=build/symbols/prod --dart-define-from-file=env/prod.json
      ios: shorebird release ios --flutter-version=3.44.1 -- --obfuscate --split-debug-info=build/symbols/prod --dart-define-from-file=env/prod.json
    # Patches must target an existing release version, so run them manually:
    #   shorebird patch android --release-version=<x.y.z+n> -- --dart-define-from-file=env/prod.json
    #   shorebird patch ios --release-version=<x.y.z+n> -- --dart-define-from-file=env/prod.json

# dart run splash_master create
splash_master:
  # Use to specifies the color for the splash screen
  color: "#154d70"
  # Use to specifies the splash image
  image: "assets/app-icons/ic_background.png"
  # Provides content mode for splash image in iOS
  # iOS content mode options: scaleToFill, scaleAspectFit, scaleAspectFill, redraw, center, top, bottom,
  # left, right, topLeft, topRight, bottomLeft, bottomRight.
  ios_content_mode: "center"
  # Provides gravity for splash image in Android
  # Android gravity options: center, clip_horizontal, clip_vertical, fill_horizontal, fill, center_vertical,
  # bottom, fill_vertical, center_horizontal, top, end, left, right, start
  android_gravity: "fill"
  # Use to specifies the splash image
  # background_image: "assets/background_image.png"
  # Provided content mode for splash image in background for iOS
  ios_background_content_mode: "center"
  # Provides gravity for background image in Android
  # Android gravity options: center, clip_horizontal, clip_vertical, fill_horizontal, fill, center_vertical,
  # bottom, fill_vertical, center_horizontal, top, end, left, right, start
  android_background_image_gravity: "fill"
  # Use to specifies image for android in dark mode
  image_dark_android: "assets/app-icons/ic_background.png"
  # Provides gravity for splash image for Android in dark mode
  android_dark_gravity_key: "center"
  # Use to specifies the color for the splash screen for Android in dark mode
  color_dark_android: "#154d70"
  # Section to specifies the configuration for the splash in Android 12+
  android_12_and_above:
    # Provides the background color of splash screen
    color: "#154d70"
    # Provides custom icon to replace the default app icon
    image: "assets/app-icons/ic_background.png"
    # Provides branding image which is shown under main icon image.
    # branding_image: "assets/branding_image.png"

#dart run icons_launcher:create
icons_launcher:
  platforms:
    android:
      enable: true
      image_path: "assets/app-icons/ic_logo_radius.png"
      notification_image: "assets/app-icons/ic_foreground.png"
      # adaptive_background_color: "#ffffff"
      adaptive_background_image: "assets/app-icons/ic_background.png"
      adaptive_foreground_image: "assets/app-icons/ic_foreground.png"
      adaptive_monochrome_image: "assets/app-icons/ic_black_white.png"
    ios:
      enable: true
      image_path: "assets/app-icons/ic_logo_rectangle_light.png"
      # For iOS 18+ (support dark and tinted)
      dark_path: "assets/app-icons/ic_logo_rectangle_dark.png"
      tinted_path: "assets/app-icons/ic_logo_rectangle_tinted.png"
    # web:
    #   enable: true
    #   image_path: "assets/app-icons/ic_logo_radius.png"
    #   favicon_path: "assets/app-icons/ic_logo_round.png"
    # macos:
    #   enable: true
    #   image_path: "assets/app-icons/ic_logo_radius.png"
    # windows:
    #   enable: false
    #   image_path: "assets/app-icons/ic_logo_radius.png"
    # linux:
    #   enable: false
    #   image_path: "assets/app-icons/ic_logo_radius.png"
