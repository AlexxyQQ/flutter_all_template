# Navigation: Home -> To-dos -> back. Works with or without a backend.
appId: com.alexxy.flutter_all_template
tags: [smoke]
---
- runFlow: _shared/launch.yaml
- tapOn:
    id: home_open_todos_button
- assertVisible: 'To-dos'   # app bar title (en-GB)
- assertVisible:
    id: todo_add_button
- back
- assertVisible:
    id: home_title
