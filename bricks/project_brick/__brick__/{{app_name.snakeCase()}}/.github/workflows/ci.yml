{{=<% %>=}}
name: CI

# Lean, Linux-only. Runs on pull requests, on every push to main (so main is
# always verified, including merges made without a PR) and manually.
# `scripts/**` is NOT ignored: firebase_init.sh runs in this very job.
# See docs/CI_CD.md for the cost model.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "codemagic.yaml"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "codemagic.yaml"
  workflow_dispatch:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter (version from .fvmrc)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Firebase config is git-ignored; lib/main.dart imports firebase_options.dart,
      # so create the placeholder files from the tracked *.example files.
      - name: Firebase placeholder config
        run: bash scripts/firebase_init.sh

      # Generated files are git-ignored, so CI must produce them.
      - name: Code generation (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Code generation (locale keys)
        run: >-
          dart run easy_localization:generate
          -S assets/translations -f keys
          -O lib/config/constants/gen -o locale_keys.g.dart

      # easy_localization emits unformatted Dart; normalise it so the
      # formatting gate below does not fail on generated code.
      - name: Format generated code
        run: dart format lib/config/constants/gen

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze


      # Custom lint rules (app_custom_lints); `flutter analyze` does not run them.
      - name: Custom lint
        run: dart run custom_lint

      - name: Test
        run: flutter test
