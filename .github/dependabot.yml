# Low-noise: one grouped PR per ecosystem per month, so CI runs a handful of
# times a month at most. Security updates are raised separately by GitHub.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      pub-all:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      gradle-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
